<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAM Compound Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Main Layout */
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            min-height: 600px;
        }

        /* Selector Panel */
        .selector-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-tertiary);
        }

        .panel-header h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        /* Compound Grid */
        .compound-grid {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .compound-item {
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .compound-item:hover {
            border-color: var(--primary);
            background: var(--bg-tertiary);
        }

        .compound-item input[type="checkbox"] {
            position: absolute;
            top: 8px;
            right: 8px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .compound-item.selected {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: transparent;
        }

        .compound-name {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            padding-right: 24px;
        }

        .compound-formula {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .compound-category {
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Results Panel */
        .results-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .results-panel.placeholder {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .placeholder-content {
            color: var(--text-secondary);
        }

        .placeholder-content h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .placeholder-content p {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .results-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-tertiary);
        }

        .results-header h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .results-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            font-size: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .results-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .result-item {
            margin-bottom: 16px;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .result-name {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 12px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        /* Status Indicator */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 8px 12px;
            background: var(--bg-primary);
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.success {
            background: var(--success);
            animation: none;
        }

        .status-dot.error {
            background: var(--error);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Selected Compounds List */
        .selected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px;
            background: var(--bg-primary);
            border-radius: 6px;
            min-height: 32px;
        }

        .selected-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: var(--primary);
            border-radius: 4px;
            font-size: 12px;
        }

        .selected-tag .remove {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.8;
        }

        .selected-tag .remove:hover {
            opacity: 1;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-primary);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            transition: width 0.3s;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
                min-height: auto;
            }
        }

        /* Scrollbar Styling */
        .compound-grid::-webkit-scrollbar,
        .results-content::-webkit-scrollbar {
            width: 8px;
        }

        .compound-grid::-webkit-scrollbar-track,
        .results-content::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        .compound-grid::-webkit-scrollbar-thumb,
        .results-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SEAM Compound Analyzer</h1>
            <p class="subtitle">Select compounds • Run analysis • View results</p>
        </header>

        <div class="layout">
            <!-- Selector Panel -->
            <div class="selector-panel">
                <div class="panel-header">
                    <h2>Compound Library</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search by name, formula, or category..." onkeyup="filterCompounds()">
                    </div>
                </div>

                <div class="compound-grid" id="compoundGrid"></div>

                <div style="padding: 16px; border-top: 1px solid var(--border);">
                    <div style="margin-bottom: 12px; font-size: 12px; color: var(--text-secondary);">
                        Selected: <strong id="selectedCount">0</strong> / 306
                    </div>

                    <div class="selected-list" id="selectedList">
                        <span style="color: var(--text-secondary);">No compounds selected</span>
                    </div>

                    <div class="controls">
                        <button class="btn btn-secondary" onclick="clearSelection()">Clear</button>
                        <button class="btn btn-primary" id="analyzeBtn" onclick="runAnalysis()" disabled>
                            Run Analysis
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Panel -->
            <div class="results-panel placeholder" id="resultsPanel">
                <div class="placeholder-content">
                    <h3>Select & Analyze</h3>
                    <p>Choose compounds from the library</p>
                    <p>Click "Run Analysis" to start</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        let allCompounds = [];
        let selectedCompounds = new Set();
        let currentTaskId = null;

        async function init() {
            try {
                const response = await fetch(`${API_URL}/compounds`);
                const data = await response.json();
                allCompounds = data.compounds;
                renderCompoundsList();
            } catch (e) {
                console.error('Failed to load compounds:', e);
                showError('Failed to load compound library. Is the backend running?');
            }
        }

        function renderCompoundsList() {
            const grid = document.getElementById('compoundGrid');
            grid.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allCompounds.filter(c => {
                const matchName = c.generic_name.toLowerCase().includes(searchTerm);
                const matchFormula = c.chemical_formula.toLowerCase().includes(searchTerm);
                const matchCategory = c.category.toLowerCase().includes(searchTerm);
                const matchTrade = c.trade_names.some(t => t.toLowerCase().includes(searchTerm));
                return matchName || matchFormula || matchCategory || matchTrade;
            });

            filtered.forEach(compound => {
                const item = document.createElement('div');
                item.className = 'compound-item' + (selectedCompounds.has(compound.generic_name) ? ' selected' : '');

                item.innerHTML = `
                    <input type="checkbox"
                           ${selectedCompounds.has(compound.generic_name) ? 'checked' : ''}
                           onchange="toggleCompound('${compound.generic_name}', this.checked)">
                    <div class="compound-name">${compound.generic_name}</div>
                    <div class="compound-formula">${compound.chemical_formula}</div>
                    <div class="compound-category">${compound.category}</div>
                `;

                item.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const checkbox = item.querySelector('input[type="checkbox"]');
                        checkbox.checked = !checkbox.checked;
                        toggleCompound(compound.generic_name, checkbox.checked);
                    }
                };

                grid.appendChild(item);
            });
        }

        function toggleCompound(name, isSelected) {
            if (isSelected) {
                selectedCompounds.add(name);
            } else {
                selectedCompounds.delete(name);
            }
            updateSelectedDisplay();
            renderCompoundsList();
        }

        function updateSelectedDisplay() {
            document.getElementById('selectedCount').textContent = selectedCompounds.size;
            document.getElementById('analyzeBtn').disabled = selectedCompounds.size === 0;

            const list = document.getElementById('selectedList');
            if (selectedCompounds.size === 0) {
                list.innerHTML = '<span style="color: var(--text-secondary);">No compounds selected</span>';
            } else {
                const selected = Array.from(selectedCompounds).sort();
                list.innerHTML = selected.map(name =>
                    `<div class="selected-tag">
                        ${name}
                        <span class="remove" onclick="toggleCompound('${name}', false)">×</span>
                    </div>`
                ).join('');
            }
        }

        function clearSelection() {
            selectedCompounds.clear();
            updateSelectedDisplay();
            renderCompoundsList();
        }

        function filterCompounds() {
            renderCompoundsList();
        }

        async function runAnalysis() {
            if (selectedCompounds.size === 0) {
                showError('Please select at least one compound');
                return;
            }

            const selected = Array.from(selectedCompounds).map(name =>
                allCompounds.find(c => c.generic_name === name)
            ).filter(c => c);

            showAnalyzing();

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ compounds: selected })
                });

                const data = await response.json();
                currentTaskId = data.task_id;

                pollResults();
            } catch (e) {
                showError(`Failed to start analysis: ${e.message}`);
            }
        }

        function pollResults() {
            const pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_URL}/results/${currentTaskId}`);
                    const task = await response.json();

                    if (task.status === 'completed') {
                        clearInterval(pollInterval);
                        displayResults(task.result);
                    } else if (task.status === 'failed') {
                        clearInterval(pollInterval);
                        showError(`Analysis failed: ${task.error}`);
                    } else {
                        updateProgress(task.progress);
                    }
                } catch (e) {
                    clearInterval(pollInterval);
                    showError(`Error polling results: ${e.message}`);
                }
            }, 500);
        }

        function showAnalyzing() {
            const panel = document.getElementById('resultsPanel');
            panel.className = 'results-panel';
            panel.innerHTML = `
                <div class="results-header">
                    <h2>Analysis Running</h2>
                    <div class="results-info">
                        <div class="info-item">
                            <span class="info-label">Status</span>
                            <span class="info-value">Processing...</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Compounds</span>
                            <span class="info-value">${selectedCompounds.size}</span>
                        </div>
                    </div>
                </div>
                <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
                    <div style="text-align: center;">
                        <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 16px;">
                            Analyzing structural perturbations...
                        </div>
                        <div class="progress-bar" style="width: 200px;">
                            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                        </div>
                        <div id="progressPercent" style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">0%</div>
                    </div>
                </div>
            `;
        }

        function updateProgress(percent) {
            const fill = document.getElementById('progressFill');
            const percentText = document.getElementById('progressPercent');
            if (fill && percentText) {
                fill.style.width = percent + '%';
                percentText.textContent = percent + '%';
            }
        }

        function displayResults(data) {
            const panel = document.getElementById('resultsPanel');
            panel.className = 'results-panel';

            let html = `
                <div class="results-header">
                    <h2>Results</h2>
                    <div class="results-info">
                        <div class="info-item">
                            <span class="info-label">Compounds</span>
                            <span class="info-value">${data.compounds_analyzed}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Lock Hash</span>
                            <span class="info-value" style="font-size: 10px;">${data.lock_sha256.substring(0, 8)}...</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Rows/Structures</span>
                            <span class="info-value">${data.rows}/${data.structures}</span>
                        </div>
                    </div>
                </div>
                <div class="results-content">
            `;

            data.compounds.forEach(compound => {
                html += `
                    <div class="result-item">
                        <div class="result-name">${compound.name}</div>
                        <div class="result-details">
                            <div class="detail">
                                <span class="detail-label">Formula</span>
                                <span style="font-family: 'JetBrains Mono';">${compound.formula}</span>
                            </div>
                            <div class="detail">
                                <span class="detail-label">Category</span>
                                <span>${compound.category}</span>
                            </div>
                            <div class="detail">
                                <span class="detail-label">Status</span>
                                <span style="color: var(--warning);">${compound.status}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            panel.innerHTML = html;
        }

        function showError(message) {
            const panel = document.getElementById('resultsPanel');
            panel.className = 'results-panel';
            panel.innerHTML = `
                <div class="results-header">
                    <h2>Error</h2>
                </div>
                <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px;">
                    <div style="text-align: center; color: var(--text-secondary);">
                        <div style="font-size: 14px; margin-bottom: 8px;">${message}</div>
                        <div style="font-size: 12px;">Check that the backend server is running on port 5000</div>
                    </div>
                </div>
            `;
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
