<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAM Dynamic Compound Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inconsolata&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-primary: #1a1a1a;
            --text-secondary: #555;
            --text-tertiary: #888;
            --bg-primary: #fafafa;
            --bg-secondary: #fff;
            --border: #ddd;
            --accent: #d84315;
            --success: #2e7d32;
            --error: #b71c1c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f5f5f5;
                --text-secondary: #bbb;
                --text-tertiary: #888;
                --bg-primary: #1e1e1e;
                --bg-secondary: #2d2d2d;
                --border: #444;
                --accent: #ff6e40;
                --success: #66bb6a;
                --error: #ef5350;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 24px;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 12px 0;
            font-weight: 600;
        }

        .header-meta {
            font-size: 13px;
            color: var(--text-tertiary);
            font-family: 'Inconsolata', monospace;
            line-height: 1.8;
        }

        .label {
            font-weight: 600;
            color: var(--text-secondary);
            display: inline-block;
            width: 140px;
        }

        .selector-section {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 3px;
            margin-bottom: 32px;
        }

        .selector-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .selected-compounds {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 40px;
            padding: 12px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 3px;
            margin-bottom: 16px;
            font-size: 13px;
            align-items: center;
        }

        .selected-compounds.empty {
            color: var(--text-tertiary);
            font-style: italic;
        }

        .compound-tag {
            background-color: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .compound-tag .remove {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.8;
        }

        .compound-tag .remove:hover {
            opacity: 1;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: 1px solid var(--border);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'Lora', serif;
            font-size: 13px;
            font-weight: 600;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            opacity: 0.9;
            color: white;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 3px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-tertiary);
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-search {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-search input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-family: 'Lora', serif;
            font-size: 13px;
        }

        .modal-body {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }

        .compounds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .compound-item {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
            cursor: pointer;
            background-color: var(--bg-primary);
            transition: all 0.2s;
        }

        .compound-item:hover {
            border-color: var(--accent);
        }

        .compound-item.selected {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .compound-item input[type="checkbox"] {
            margin-right: 8px;
        }

        .compound-item-name {
            font-weight: 600;
            font-size: 13px;
        }

        .compound-item-info {
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.8;
        }

        .modal-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }

        .loading {
            text-align: center;
            padding: 24px;
            color: var(--text-tertiary);
        }

        .loading-spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background-color: var(--error);
            color: white;
            padding: 12px 16px;
            border-radius: 3px;
            margin-bottom: 16px;
        }

        .success-message {
            background-color: var(--success);
            color: white;
            padding: 12px 16px;
            border-radius: 3px;
            margin-bottom: 16px;
        }

        .compound-result {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 3px;
            margin-bottom: 16px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .result-name {
            font-size: 16px;
            font-weight: 600;
        }

        .result-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: white;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .result-item {
            padding: 8px;
            background-color: var(--bg-primary);
            border-radius: 3px;
        }

        .result-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .result-value {
            font-family: 'Inconsolata', monospace;
            color: var(--text-primary);
            word-break: break-all;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .modal-content {
                width: 95%;
                max-height: 90vh;
            }

            .compounds-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function loadCompounds() {
            try {
                allCompounds = compoundDatabase.compounds;
                renderCompoundsList();
            } catch (e) {
                console.error('Could not load compounds:', e);
                showError('Failed to load compound library');
            }
        }

        function renderCompoundsList() {
            const grid = document.getElementById('compoundsGrid');
            grid.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allCompounds.filter(c => {
                const matchName = c.name.toLowerCase().includes(searchTerm);
                const matchFormula = c.formula.toLowerCase().includes(searchTerm);
                const matchCategory = c.category.toLowerCase().includes(searchTerm);
                return matchName || matchFormula || matchCategory;
            });

            filtered.forEach(compound => {
                const item = document.createElement('div');
                item.className = 'compound-item' + (selectedCompounds.has(compound.name) ? ' selected' : '');

                item.innerHTML = `
                    <label style="cursor: pointer; display: flex; align-items: flex-start;">
                        <input type="checkbox"
                               ${selectedCompounds.has(compound.name) ? 'checked' : ''}
                               onchange="toggleCompound('${compound.name}', this.checked)"
                               style="margin-top: 2px; cursor: pointer;">
                        <div style="flex: 1;">
                            <div class="compound-item-name">${compound.name}</div>
                            <div class="compound-item-info">
                                ${compound.formula} • ${compound.mw.toFixed(2)} g/mol<br>
                                ${compound.category} • ${compound.status}
                            </div>
                        </div>
                    </label>
                `;

                item.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const checkbox = item.querySelector('input[type="checkbox"]');
                        checkbox.checked = !checkbox.checked;
                        toggleCompound(compound.name, checkbox.checked);
                    }
                };

                grid.appendChild(item);
            });
        }

        function toggleCompound(name, isSelected) {
            if (isSelected) {
                selectedCompounds.add(name);
            } else {
                selectedCompounds.delete(name);
            }
            updateSelectedDisplay();
            renderCompoundsList();
        }

        function filterCompounds() {
            renderCompoundsList();
        }

        function openSelector() {
            document.getElementById('modal').classList.add('active');
        }

        function closeSelector() {
            document.getElementById('modal').classList.remove('active');
            updateSelectedDisplay();
        }

        function updateSelectedDisplay() {
            const container = document.getElementById('selectedCompounds');

            if (selectedCompounds.size === 0) {
                container.textContent = 'No compounds selected';
                container.classList.add('empty');
                document.getElementById('analyzeBtn').disabled = true;
            } else {
                container.innerHTML = '';
                container.classList.remove('empty');

                const selected = Array.from(selectedCompounds).sort();
                selected.forEach(name => {
                    const tag = document.createElement('div');
                    tag.className = 'compound-tag';
                    tag.innerHTML = `
                        ${name}
                        <span class="remove" onclick="toggleCompound('${name}', false)">×</span>
                    `;
                    container.appendChild(tag);
                });

                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        function clearSelection() {
            selectedCompounds.clear();
            updateSelectedDisplay();
            renderCompoundsList();
        }

        async function runAnalysis() {
            if (selectedCompounds.size === 0) {
                showError('Please select at least one compound');
                return;
            }

            const resultsSection = document.getElementById('resultsSection');
            const resultsContent = document.getElementById('resultsContent');

            resultsSection.classList.add('active');
            resultsContent.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Running SEAM analysis on ${selectedCompounds.size} compound(s)...</p>
                </div>
            `;

            try {
                // Prepare the list of compounds for analysis
                const compoundsToAnalyze = Array.from(selectedCompounds).map(name => {
                    return allCompounds.find(c => c.name === name);
                });

                // Call the backend API
                const response = await fetch('http://localhost:5000/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        compounds: compoundsToAnalyze,
                        runtime_path: 'SEAM_DRUG_STRUCTURAL_RUNTIME_LOCKED_v3_12'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.statusText}`);
                }

                const results = await response.json();
                displayResults(results);
            } catch (e) {
                console.error('Analysis failed:', e);
                resultsContent.innerHTML = `
                    <div class="error-message">
                        <strong>Analysis Failed:</strong> ${e.message}
                    </div>
                    <p style="color: var(--text-tertiary); font-size: 13px;">
                        The server is not running. To run analyses, you need to start the backend server:<br>
                        <code style="background: var(--bg-primary); padding: 4px 8px; border-radius: 3px; display: inline-block; margin-top: 8px;">
                            python seam-backend.py
                        </code>
                    </p>
                `;
            }
        }

        function displayResults(data) {
            const resultsContent = document.getElementById('resultsContent');
            let html = `
                <div class="section">
                    <h2 class="section-title">Analysis Results</h2>
                    <div style="font-size: 13px; color: var(--text-tertiary); margin-bottom: 16px;">
                        Analyzed ${data.compounds.length} compound(s) • Lock: 62c6aa75...
                    </div>
                </div>
            `;

            data.compounds.forEach(compound => {
                const loading = (compound.dose_mg_day / compound.mw).toFixed(6);

                html += `
                    <div class="compound-result">
                        <div class="result-header">
                            <div class="result-name">${compound.name}</div>
                            <span class="result-badge" style="background: ${compound.status === 'withdrawn' ? '#b71c1c' : '#2e7d32'}">
                                ${compound.status}
                            </span>
                        </div>

                        <div class="result-grid">
                            <div class="result-item">
                                <div class="result-label">Formula</div>
                                <div class="result-value">${compound.formula}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">MW</div>
                                <div class="result-value">${compound.mw.toFixed(3)} g/mol</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">Dose</div>
                                <div class="result-value">${compound.dose_mg_day} mg/day</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">Loading λ</div>
                                <div class="result-value">${loading}</div>
                            </div>
                        </div>

                        <div style="background: var(--bg-primary); padding: 8px; border-radius: 3px; border-left: 4px solid var(--accent);">
                            <div class="result-label">Status</div>
                            <div style="font-size: 13px; margin-bottom: 4px;">
                                <strong>Pending:</strong> Run via backend server for dynamic results
                            </div>
                            <div style="font-size: 12px; color: var(--text-tertiary);">
                                Command: <code>python seam-backend.py --runtime /path/to/SEAM_DRUG_STRUCTURAL_RUNTIME_LOCKED_v3_12</code>
                            </div>
                        </div>
                    </div>
                `;
            });

            resultsContent.innerHTML = html;
        }

        function showError(message) {
            const resultsContent = document.getElementById('resultsContent');
            resultsContent.innerHTML = `<div class="error-message">${message}</div>`;
            document.getElementById('resultsSection').classList.add('active');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadCompounds);
        // Also try to load immediately if DOM is already ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadCompounds);
        } else {
            loadCompounds();
        }
    </script>
</body>
</html>
